name: "Setup Node.js and pnpm"
description: "Sets up Node.js and pnpm with caching"

inputs:
  node-version:
    description: "Node.js version (or path to .node-version file)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Read .node-version file (if provided)
      id: read-node-version
      uses: actions/read-file@v1
      if: ${{ inputs.node-version == '.node-version' }}
      with:
        path: ./.node-version

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.read-node-version.outputs.content || inputs.node-version || '22' }} # Use file content or input or default
        cache: "pnpm"

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: |
          - recursive: true
          - args: [--frozen-lockfile]

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.STORE_PATH }}
          node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
